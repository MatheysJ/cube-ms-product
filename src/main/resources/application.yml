spring:
  application:
    name: cube-ms-product
  data:
    mongodb:
      host: localhost
      port: 27017
      database: product_db
      user: "${MONGO_USER:root}"
      password: "${MONGO_PASSWORD:pass}"

algolia:
  applicationId: "${ALGOLIA_APP_ID}"
  apiKey: "${ALGOLIA_API_KEY}"

eureka:
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: ${EUREKA_URL:https://cube-ms-eureka.onrender.com/eureka/}
  instance:
    hostname: ${EUREKA_INSTANCE:47e0b7d5567d.ngrok-free.app}
    secure-port: 443
    secure-port-enabled: true
    non-secure-port-enabled: false
    prefer-ip-address: false

server:
  port: 8081
  error:
    include-message: always